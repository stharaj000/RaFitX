<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX — What is your primary goal?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/OnboardingCss/goal.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">RaFitX</div>
        <div class="help">?</div>
    </div>

    <div class="content">
        <h1>Which Muscle Group Do You Want To Hit?</h1>
        <div class="sub">Select the target muscle group that you want to hit.
        </div>
        <div class="options">
            <label>
                <div class="option" style="display: flex; align-items: center;">
                    <div class="icon-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" />
                            <polyline points="16 17 22 17 22 11" />
                        </svg>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <div>
                            <h3>Push</h3>
                            <p>Chest, Shoulder, Triceps</p>
                        </div>
                        <input type="radio" name="option" value="push" style="width: 20px; height: 20px;">
                    </div>
                </div>
            </label>

            <label>
                <div class="option" style="display: flex; align-items: center;">
                    <div class="icon-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v3" />
                            <path d="M4 8h16" />
                            <path d="M6 8l-3 6a3 3 0 0 0 6 0z" />
                            <path d="M18 8l-3 6a3 3 0 0 0 6 0z" />
                        </svg>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <div>
                            <h3>Pull</h3>
                            <p>Back, Biceps</p>
                        </div>
                        <input type="radio" name="option" value="pull" style="width: 20px; height: 20px;">
                    </div>
                </div>
            </label>

            <label>
                <div class="option" style="display: flex; align-items: center;">
                    <div class="icon-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="2 17 8.5 10.5 13.5 15.5 22 7" />
                            <polyline points="16 7 22 7 22 13" />
                        </svg>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <div>
                            <h3>Legs</h3>
                            <p>Quards, Hamstrings, Calfs</p>
                        </div>
                        <input type="radio" name="option" value="lose legs" style="width: 20px; height: 20px;">
                    </div>
                </div>
            </label>
        </div>
    </div>
    <div class="footer">
        <button onclick="window.location.href = 'leg.html'" id="finishButton" class="cta">Let's Go
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
            </svg>
        </button>

    </div>


    <!-- <script src="/frontend/js/onboardingScript/goal.js"></script> -->
</body>

</html>
