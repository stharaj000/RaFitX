<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX — What is your gender?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/OnboardingCss/gender.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">RaFitX</div>
        <div class="help">?</div>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg"></div>
            <div class="seg"></div>
            <div class="seg"></div>
            <div class="seg"></div>
        </div>
        <div class="step-label">STEP 2/6</div>
    </div>
    <div class="content">
        <h1>What is Your Gender?</h1>
        <div class="sub">Select your gender to help us personalize your training.</div>
        <div class="options">
            <div class="option">
                <div class="icon-circle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="10" cy="14" r="5" />
                        <path d="M19 5 14 10" />
                        <path d="M14 5h5v5" />
                    </svg>
                </div>
                <div class="option-label">Male</div>
                <input type="radio">
            </div>
            <div class="option">
                <div class="icon-circle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="9" r="5" />
                        <path d="M12 14v7" />
                        <path d="M9 18h6" />
                    </svg>
                </div>
                <div class="option-label">Female</div>
                <input type="radio">
            </div>
            <div class="option">
                <div class="icon-circle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M5 21c0-4 3-6 7-6s7 2 7 6" />
                    </svg>
                </div>
                <div class="option-label">Prefer not to say</div>
                <input type="radio">
            </div>
        </div>
    </div>
    <div class="footer">
        <a href="age.html" style="text-decoration: none;"> <button class="cta">Continue
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </a>
    </div>
</body>

</html>
