<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX — How old are you?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/OnboardingCss/age.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">
            <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg>
            RaFitX
        </div>
        <div class="help">?</div>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg"></div>
            <div class="seg"></div>
            <div class="seg"></div>
        </div>
        <div class="step-label">STEP 3/6</div>
    </div>
    <div class="content">
        <h1>How old are you?</h1>
        <div class="sub">Your age helps us calculate your personalized metabolic rate.</div>

        <div class="picker-wrap">
            <div class="center-lines"></div>
            <div class="picker" id="agePicker"></div>
        </div>

        <div class="badge" id="ageBadge">Selected: 25 years old</div>
    </div>
    <div class="footer">
        <a href="weight.html" style="text-decoration: none;"><button class="cta">Continue
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </a>
    </div>

    <script>
        const picker = document.getElementById('agePicker');
        const badge = document.getElementById('ageBadge');
        const min = 10, max = 102, defaultAge = 17;
        const itemH = 52;
        for (let a = min; a <= max; a++) {
            const div = document.createElement('div');
            div.className = 'picker-item';
            div.textContent = a;
            div.dataset.value = a;
            picker.appendChild(div);
        }
        function setSelected(age) {
            document.querySelectorAll('.picker-item').forEach(el => {
                el.classList.toggle('selected', parseInt(el.dataset.value) === age);
            });
            badge.textContent = 'Selected: ' + age + ' years old';
        }
        // center default item
        picker.scrollTop = (defaultAge - min) * itemH;
        setSelected(defaultAge);

        let scrollTimeout;
        picker.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const idx = Math.round(picker.scrollTop / itemH + 2);
                const age = min + idx;
                setSelected(age);
            }, 0);
        });
    </script>
</body>

</html>
