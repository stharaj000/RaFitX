<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/frontend/css/register.css">
</head>

<body>

    <div class="left-side">
        <div class="dark-overlay"></div>
        <div class="left-content">
            <img src="/frontend/img/TransparentBack.png" alt="rafitx" width="150" height="150">
            <div class="left-title">Rise Your Fitness Experience.</div>
            <div class="left-text">
                Join a community of elite performers. Access personalized training, advanced analytics, and professional
                nutrition guidance.
            </div>
    
        </div>
    </div>

    <div class="right-side">
        <div class="form-box">

            <div class="welcome-title">Create Account</div>
            <div class="welcome-subtitle">Elevate your performance with premium fitness tracking.</div>

            <div class="social-buttons">
                <button class="social-btn">
                    <span>
                        <img src="https://logo-teka.com/wp-content/uploads/2025/06/google-logo.svg"
                            alt="SVG logo Google" style="max-width:20px; height: 20px;">
                    </span>
                    Google
                </button>
                <!-- <button class="social-btn apple-btn">&#63743; Apple</button> -->
            </div>

            <div class="divider">
                <div class="divider-line"></div>
                <span>OR SIGN UP WITH EMAIL</span>
                <div class="divider-line"></div>
            </div>


            <div class="input-wrap">
                <input id="email" class="field-input" type="email" placeholder="Email">
            </div>

            <div class="two-col">
                <div>
                    <div class="input-wrap">
                        <input id="password" class="field-input" type="password" placeholder="Password">
                    </div>
                </div>
                <div>
                    <div class="input-wrap">
                        <input id="confirmPassword" class="field-input" type="password" placeholder="Confirm password">
                    </div>
                </div>
            </div>



            <button id="signupBtn" class="signup-btn">Sign Up &#8594;</button>

            <div class="signin-text">
                Already have an account? <a href="/frontend/html/login.html">Sign In</a>
            </div>

        </div>
    </div>


    <script src="/frontend/js/register.js"></script>

</body>

</html>
