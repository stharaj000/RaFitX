<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX - Welcome Back</title>
    <link rel="icon" type="image/x-icon" href="/frontend/img/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/frontend/css/login.css">
</head>

<body>

    <div class="left-side">
        <div class="dark-overlay"></div>
        <div class="left-content">
            <img src="/frontend/img/TransparentBack.png" alt="rafitx" width="150" height="150">
            <div class="left-title">Rise Your Fitness Experience.</div>
            <div class="left-text">
                Experience a new standard of personal training. Precision data, elite coaching, and a community built on
                performance.
            </div>
            <div class="bottom-tag">
                <div class="gear-icon">&#9881;</div>
                PREMIUM DISCIPLINE
            </div>
        </div>
    </div>

    <div class="right-side">
        <div class="form-box">

            <div class="welcome-title">Welcome back</div>
            <div class="welcome-subtitle">Please enter your details to sign in.</div>

            <div class="social-buttons">
                <!-- <button class="social-btn">&#63743; Apple</button> -->
                <button class="social-btn" style="display: flex; justify-content: center; align-items: center;">
                    <span>
                        <img src="https://logo-teka.com/wp-content/uploads/2025/06/google-logo.svg"
                            alt="SVG logo Google" style="max-width:20px; height: 20px;">
                    </span> Google</button>
            </div>

            <div class="divider">
                <div class="divider-line"></div>
                <span>OR EMAIL</span>
                <div class="divider-line"></div>
            </div>

            <input id="email" class="field-input" type="email" placeholder="Email">

            <input id="password" class="field-input" type="password" placeholder="Password">
            <div class="password-row">
                <a class="forgot-link" href="#" style="width: 100%; display: flex; justify-content: flex-end;">Forgot
                    password?</a>
            </div>

            <br>

            <button id="signInBtn" class="signin-btn">Sign In</button>

            <div class="signup-text">
                Don't have an account? <a href="/frontend/html/register.html">Sign up</a>
            </div>


        </div>
    </div>

    <script src="/frontend/js/login.js"></script>
</body>

</html>
