<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Workout Log</title>
    <style>
        :root {
            --emerald: #0d4c3c;
            --emerald-container: #dcfce7;
            --surface: #f8faf7;
            --surface-container: #eef1ec;
            --outline: #d1d5db;
            --card-border: #f1f5f9;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --success: #059669;
            --error: #dc2626;

            --bg: var(--surface);
            --card: #ffffff;
            --card-soft: var(--surface-container);
            --border: var(--outline);
            --text: var(--text-dark);
            --text-dim: var(--text-muted);
            --text-faint: #9ca3af;
            --blue: var(--emerald);
            --blue-dim: #0d4c3c22;
            --green: var(--success);
            --green-bg: var(--emerald-container);
            --orange: #b45309;
            --red: var(--error);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(248, 250, 247, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chevron {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .rest-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-soft);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            transition: background .2s, color .2s;
        }

        .rest-pill.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .timer {
            font-variant-numeric: tabular-nums;
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.3px;
        }

        .finish-btn {
            background: none;
            border: none;
            color: var(--blue);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 4px;
        }

        .finish-btn:active {
            opacity: 0.6;
        }

        /* ---------- Workout header ---------- */
        .workout-head {
            padding: 18px 16px 4px;
        }

        .workout-title {
            background: none;
            border: none;
            color: var(--text);
            font-size: 26px;
            font-weight: 800;
            width: 100%;
            font-family: inherit;
            padding: 0;
            outline: none;
        }

        .workout-title::placeholder {
            color: var(--text-faint);
        }

        .workout-meta {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .notes-box {
            background: var(--card-soft);
            border-radius: var(--radius);
            padding: 16px;
            margin: 14px 16px 0;
            color: black;
            font-size: 15px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .notes-box[contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: var(--text-faint);
        }

        /* ---------- Exercise card ---------- */
        .exercise {
            margin: 22px 16px 0;
        }

        .exercise-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .exercise-name {
            background: none;
            border: none;
            color: var(--blue);
            font-size: 19px;
            font-weight: 700;
            font-family: inherit;
            padding: 0;
            outline: none;
            flex: 1;
            min-width: 0;
        }

        .exercise-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: var(--card-soft);
            border: 1px solid var(--border);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        .icon-btn.ghost {
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-size: 20px;
        }

        .set-table {
            width: 100%;
            border-collapse: collapse;
        }

        .set-table thead th {
            text-align: center;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 6px 4px 10px;
        }

        .set-table thead th:first-child {
            text-align: center;
            width: 14%;
        }

        .set-table thead th:nth-child(2) {
            width: 26%;
        }

        .set-table thead th:nth-child(3) {
            width: 22%;
        }

        .set-table thead th:nth-child(4) {
            width: 22%;
        }

        .set-table thead th:last-child {
            width: 16%;
        }

        .set-row td {
            padding: 5px 4px;
            text-align: center;
            vertical-align: middle;
        }

        .set-row.completed {
            background: var(--green-bg);
        }

        .set-row.completed td:first-child {
            border-radius: 8px 0 0 8px;
        }

        .set-row.completed td:last-child {
            border-radius: 0 8px 8px 0;
        }

        .set-num {
            font-weight: 800;
            font-size: 15px;
            color: var(--text);
        }

        .set-num.warmup {
            color: var(--orange);
        }

        .set-prev {
            color: var(--text-faint);
            font-size: 14px;
        }

        .set-prev .w-tag {
            color: var(--orange);
        }

        .set-input {
            width: 100%;
            max-width: 78px;
            background: var(--card-soft);
            border: 1px solid var(--border);
            color: var(--text);
            text-align: center;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            padding: 9px 4px;
            font-family: inherit;
            outline: none;
        }

        .set-row.completed .set-input {
            background: transparent;
            border-color: transparent;
            color: var(--text);
        }

        .set-input:focus {
            border-color: var(--blue);
        }

        .check-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: var(--card-soft);
            color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 800;
        }

        .check-btn.done {
            background: var(--green);
            border-color: var(--green);
            color: #ffffff;
        }

        .del-set {
            background: none;
            border: none;
            color: var(--red);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 2px 2px;
            cursor: pointer;
            opacity: 0.85;
        }

        .add-set-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: none;
            border: none;
            color: var(--blue);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.4px;
            padding: 12px 0 4px;
            cursor: pointer;
        }

        .add-set-btn:active {
            opacity: 0.6;
        }

        /* ---------- Rest timer bar ---------- */
        .rest-bar-wrap {
            margin-top: 8px;
        }

        .rest-bar {
            position: relative;
            height: 38px;
            border-radius: 9px;
            overflow: hidden;
            background: var(--surface-container);
            border: 1px solid var(--border);
        }

        .rest-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: var(--blue);
            width: 100%;
            transition: width 1s linear;
        }

        .rest-bar-label {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- Bottom actions ---------- */
        .bottom-actions {
            padding: 26px 16px 10px;
            text-align: center;
        }

        .add-exercise-btn {
            display: inline-block;
            width: 100%;
            background: var(--card-soft);
            border: 1px solid var(--border);
            color: var(--blue);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.4px;
            padding: 14px 0;
            border-radius: var(--radius);
            cursor: pointer;
            margin-bottom: 14px;
        }

        .add-exercise-btn:active {
            opacity: 0.7;
        }

        .cancel-btn {
            background: none;
            border: none;
            color: var(--red);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.4px;
            padding: 10px 0;
            cursor: pointer;
        }

        /* ---------- Empty state ---------- */
        .empty {
            margin: 40px 16px;
            text-align: center;
            color: var(--text-dim);
        }

        .empty h3 {
            color: var(--text);
            font-size: 18px;
            margin-bottom: 6px;
        }

        /* ---------- History drawer ---------- */
        .history-toggle {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 30;
            background: var(--card-soft);
            border: 1px solid var(--border);
            color: var(--text);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(17, 24, 39, 0.18);
        }

        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, 0.4);
            z-index: 40;
            display: none;
        }

        .drawer-backdrop.open {
            display: block;
        }

        .drawer {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: min(340px, 86vw);
            z-index: 41;
            background: var(--surface);
            border-left: 1px solid var(--border);
            transform: translateX(100%);
            transition: transform .25s ease;
            overflow-y: auto;
            padding: 18px 16px 40px;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer h2 {
            font-size: 20px;
            margin: 4px 0 16px;
        }

        .hist-item {
            background: var(--card-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .hist-item .h-title {
            font-weight: 800;
            font-size: 15px;
        }

        .hist-item .h-meta {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 2px;
        }

        .hist-item .h-ex {
            color: var(--text-dim);
            font-size: 12.5px;
            margin-top: 6px;
            line-height: 1.5;
        }

        .hist-empty {
            color: var(--text-faint);
            font-size: 14px;
            text-align: center;
            margin-top: 30px;
        }

        .drawer-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-left">
            <button class="chevron" title="Collapse">⌄</button>
            <div class="rest-pill" id="restPill">⏱ Rest</div>
        </div>
        <div class="timer" id="workoutTimer">0:00</div>
        <button class="finish-btn" id="finishBtn">FINISH</button>
    </div>

    <div class="workout-head">
        <input class="workout-title" id="workoutTitle" value="Leg (Home edition)" placeholder="Workout title">
        <div class="workout-meta" id="workoutMeta">0:00 elapsed</div>
    </div>

    <div class="notes-box" id="notesBox" contenteditable="true"
        data-placeholder="Warm-up notes… e.g. Neck Spin, Jumping Jacks, Butt Kick, High Knee, Free Squat">Warm-Up :-

        • Neck Spin
        • Jumping Jacks
        • Butt Kick
        • High Knee
        • Free Squat</div>

    <div id="exerciseList"></div>

    <div id="emptyState" class="empty" style="display:none;">
        <h3>No exercises yet</h3>
        <div>Tap "Add Exercise" below to start logging.</div>
    </div>

    <div class="bottom-actions">
        <button class="add-exercise-btn" id="addExerciseBtn">ADD EXERCISE</button>
        <button onclick="window.location.href = '/frontend/html/dashboard.html'" class="cancel-btn" id="cancelBtn">CANCEL WORKOUT</button>
    </div>

    <div class="history-toggle" id="historyToggle" title="History">🕓</div>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer" id="drawer">
        <button class="drawer-close" id="drawerClose">✕</button>
        <h2>History</h2>
        <div id="historyList"></div>
    </div>

    <script>
        (function () {
            const STORAGE_KEY_CURRENT = 'wlog:current';
            const STORAGE_KEY_HISTORY = 'wlog:history';
            const STORAGE_KEY_PREV = 'wlog:prevByName';

            let exercises = [];     // {id, name, sets:[{id,label,prevText,weight,reps,completed}]}
            let exIdSeed = 1, setIdSeed = 1;
            let prevByName = {};    // exercise name -> {weight, reps}
            let workoutStartTime = Date.now();
            let elapsedTimerHandle = null;

            let restRunning = false;
            let restRemaining = 0;
            let restTotal = 0;
            let restHandle = null;
            let restBarEl = null; // the currently open rest bar row element

            const exerciseList = document.getElementById('exerciseList');
            const emptyState = document.getElementById('emptyState');
            const workoutTimer = document.getElementById('workoutTimer');
            const workoutMeta = document.getElementById('workoutMeta');
            const restPill = document.getElementById('restPill');

            function fmt(secs) {
                secs = Math.max(0, Math.round(secs));
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return m + ':' + String(s).padStart(2, '0');
            }

            function startElapsedTimer() {
                if (elapsedTimerHandle) clearInterval(elapsedTimerHandle);
                elapsedTimerHandle = setInterval(() => {
                    const secs = (Date.now() - workoutStartTime) / 1000;
                    workoutTimer.textContent = fmt(secs);
                    workoutMeta.textContent = fmt(secs) + ' elapsed';
                }, 1000);
            }

            function newSet(overrides) {
                return Object.assign({
                    id: 'set' + (setIdSeed++),
                    label: null,           // null => numeric, otherwise 'W'
                    weight: '',
                    reps: '',
                    completed: false
                }, overrides);
            }

            function newExercise(name) {
                return {
                    id: 'ex' + (exIdSeed++),
                    name: name,
                    sets: [newSet({})]
                };
            }

            function render() {
                exerciseList.innerHTML = '';
                emptyState.style.display = exercises.length ? 'none' : 'block';

                exercises.forEach(ex => {
                    const prev = prevByName[ex.name] || null;

                    const wrap = document.createElement('div');
                    wrap.className = 'exercise';
                    wrap.dataset.exId = ex.id;

                    wrap.innerHTML = `
        <div class="exercise-head">
          <input class="exercise-name" value="${escapeAttr(ex.name)}" data-role="ex-name">
          <div class="exercise-actions">
            <div class="icon-btn" title="Progress">📈</div>
            <button class="icon-btn ghost" data-role="ex-menu" title="More">⋯</button>
          </div>
        </div>
        <table class="set-table">
          <thead>
            <tr>
              <th>Set</th><th>Previous</th><th>(+kg)</th><th>Reps</th><th>✓</th>
            </tr>
          </thead>
          <tbody data-role="set-body"></tbody>
        </table>
        <button class="add-set-btn" data-role="add-set">ADD SET</button>
      `;

                    const tbody = wrap.querySelector('[data-role="set-body"]');
                    ex.sets.forEach((set, idx) => {
                        const tr = document.createElement('tr');
                        tr.className = 'set-row' + (set.completed ? ' completed' : '');
                        tr.dataset.setId = set.id;

                        const setLabel = set.label ? set.label : (idx - ex.sets.filter(s => s.label).length + 1);
                        const isWarmup = !!set.label;

                        let prevText = '—';
                        if (prev) {
                            prevText = prev.weight ? `${prev.weight}kg × ${prev.reps}` : `${prev.reps} reps`;
                        }

                        tr.innerHTML = `
          <td>
            <div class="set-num ${isWarmup ? 'warmup' : ''}">${isWarmup ? set.label : setLabel}</div>
          </td>
          <td><div class="set-prev">${prevText}</div></td>
          <td><input class="set-input" data-role="weight" inputmode="decimal" placeholder="—" value="${escapeAttr(set.weight)}"></td>
          <td><input class="set-input" data-role="reps" inputmode="numeric" placeholder="0" value="${escapeAttr(set.reps)}"></td>
          <td><button class="check-btn ${set.completed ? 'done' : ''}" data-role="check">✓</button></td>
        `;
                        tbody.appendChild(tr);
                    });

                    exerciseList.appendChild(wrap);
                });

                saveCurrent();
            }

            function escapeAttr(v) {
                return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
            }

            // ---------- Event delegation ----------
            exerciseList.addEventListener('click', (e) => {
                const exWrap = e.target.closest('.exercise');
                if (!exWrap) return;
                const ex = exercises.find(x => x.id === exWrap.dataset.exId);
                if (!ex) return;

                if (e.target.matches('[data-role="add-set"]')) {
                    ex.sets.push(newSet({}));
                    render();
                    return;
                }
                if (e.target.matches('[data-role="ex-menu"]')) {
                    if (confirm(`Delete "${ex.name}"?`)) {
                        exercises = exercises.filter(x => x.id !== ex.id);
                        render();
                    }
                    return;
                }
                if (e.target.matches('[data-role="check"]')) {
                    const row = e.target.closest('.set-row');
                    const set = ex.sets.find(s => s.id === row.dataset.setId);
                    set.completed = !set.completed;
                    if (set.completed) {
                        // save as "previous" for this exercise name
                        if (set.reps) {
                            prevByName[ex.name] = { weight: set.weight || '', reps: set.reps };
                            saveJSON(STORAGE_KEY_PREV, prevByName);
                        }
                        startRest(90);
                    }
                    render();
                    return;
                }
            });

            exerciseList.addEventListener('input', (e) => {
                const exWrap = e.target.closest('.exercise');
                if (!exWrap) return;
                const ex = exercises.find(x => x.id === exWrap.dataset.exId);
                if (!ex) return;

                if (e.target.matches('[data-role="ex-name"]')) {
                    ex.name = e.target.value;
                    saveCurrent();
                    return;
                }
                const row = e.target.closest('.set-row');
                if (!row) return;
                const set = ex.sets.find(s => s.id === row.dataset.setId);
                if (!set) return;
                if (e.target.matches('[data-role="weight"]')) set.weight = e.target.value;
                if (e.target.matches('[data-role="reps"]')) set.reps = e.target.value;
                saveCurrent();
            });

            // long-press-ish: double click a set row's set-number cell to delete the set
            exerciseList.addEventListener('dblclick', (e) => {
                const row = e.target.closest('.set-row');
                if (!row) return;
                const exWrap = e.target.closest('.exercise');
                const ex = exercises.find(x => x.id === exWrap.dataset.exId);
                if (ex.sets.length <= 1) return;
                ex.sets = ex.sets.filter(s => s.id !== row.dataset.setId);
                render();
            });

            // ---------- Add exercise ----------
            document.getElementById('addExerciseBtn').addEventListener('click', () => {
                const name = prompt('Exercise name:');
                if (!name) return;
                exercises.push(newExercise(name.trim()));
                render();
            });

            // ---------- Cancel workout ----------
            document.getElementById('cancelBtn').addEventListener('click', () => {
                if (!confirm('Cancel this workout? All unsaved progress will be lost.')) return;
                exercises = [];
                document.getElementById('workoutTitle').value = 'New Workout';
                document.getElementById('notesBox').innerHTML = '';
                workoutStartTime = Date.now();
                stopRest();
                render();
            });

            // ---------- Finish workout ----------
            document.getElementById('finishBtn').addEventListener('click', async () => {
                if (!exercises.length) { alert('Add at least one exercise before finishing.'); return; }
                const title = document.getElementById('workoutTitle').value || 'Workout';
                const durationSecs = (Date.now() - workoutStartTime) / 1000;

                const summary = exercises.map(ex => {
                    const completedSets = ex.sets.filter(s => s.completed);
                    return {
                        name: ex.name,
                        sets: completedSets.map(s => ({ weight: s.weight, reps: s.reps }))
                    };
                }).filter(e => e.sets.length);

                const entry = {
                    id: 'w' + Date.now(),
                    title,
                    date: new Date().toISOString(),
                    durationSecs,
                    exercises: summary
                };

                const history = await loadJSON(STORAGE_KEY_HISTORY, []);
                history.unshift(entry);
                await saveJSON(STORAGE_KEY_HISTORY, history);

                alert('Workout saved! 💪');

                exercises = [];
                document.getElementById('workoutTitle').value = 'New Workout';
                workoutStartTime = Date.now();
                stopRest();
                render();
                renderHistory();
            });

            // ---------- Rest timer ----------
            function startRest(seconds) {
                restTotal = seconds;
                restRemaining = seconds;
                restRunning = true;
                updateRestPill();
                if (restHandle) clearInterval(restHandle);
                restHandle = setInterval(() => {
                    restRemaining -= 1;
                    if (restRemaining <= 0) {
                        clearInterval(restHandle);
                        restRunning = false;
                        restRemaining = 0;
                    }
                    updateRestPill();
                }, 1000);
            }
            function stopRest() {
                restRunning = false;
                if (restHandle) clearInterval(restHandle);
                updateRestPill();
            }
            function updateRestPill() {
                restPill.classList.toggle('active', restRunning);
                restPill.textContent = restRunning ? ('⏱ ' + fmt(restRemaining)) : '⏱ Rest';
            }
            restPill.addEventListener('click', () => {
                if (restRunning) { stopRest(); } else { startRest(90); }
            });

            // ---------- Persistence ----------
            function saveJSON(key, obj) {
                try {
                    return window.storage.set(key, JSON.stringify(obj));
                } catch (e) { console.error('save failed', e); }
            }
            async function loadJSON(key, fallback) {
                try {
                    const res = await window.storage.get(key);
                    return res ? JSON.parse(res.value) : fallback;
                } catch (e) {
                    return fallback;
                }
            }

            function saveCurrent() {
                const state = {
                    title: document.getElementById('workoutTitle').value,
                    notes: document.getElementById('notesBox').innerHTML,
                    exercises,
                    workoutStartTime
                };
                saveJSON(STORAGE_KEY_CURRENT, state);
            }

            document.getElementById('workoutTitle').addEventListener('input', saveCurrent);
            document.getElementById('notesBox').addEventListener('input', saveCurrent);

            // ---------- History drawer ----------
            const drawer = document.getElementById('drawer');
            const backdrop = document.getElementById('drawerBackdrop');
            function openDrawer() { drawer.classList.add('open'); backdrop.classList.add('open'); renderHistory(); }
            function closeDrawer() { drawer.classList.remove('open'); backdrop.classList.remove('open'); }
            document.getElementById('historyToggle').addEventListener('click', openDrawer);
            document.getElementById('drawerClose').addEventListener('click', closeDrawer);
            backdrop.addEventListener('click', closeDrawer);

            async function renderHistory() {
                const history = await loadJSON(STORAGE_KEY_HISTORY, []);
                const list = document.getElementById('historyList');
                if (!history.length) {
                    list.innerHTML = '<div class="hist-empty">No workouts logged yet.</div>';
                    return;
                }
                list.innerHTML = history.map(h => {
                    const d = new Date(h.date);
                    const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    const exLines = h.exercises.map(ex => {
                        const setStr = ex.sets.map(s => s.weight ? `${s.weight}kg×${s.reps}` : `${s.reps}`).join(', ');
                        return `${ex.name}: ${setStr}`;
                    }).join('<br>');
                    return `<div class="hist-item">
        <div class="h-title">${escapeAttr(h.title)}</div>
        <div class="h-meta">${dateStr} · ${fmt(h.durationSecs)}</div>
        <div class="h-ex">${exLines}</div>
      </div>`;
                }).join('');
            }

            // ---------- Init ----------
            async function init() {
                const saved = await loadJSON(STORAGE_KEY_CURRENT, null);
                prevByName = await loadJSON(STORAGE_KEY_PREV, {});

                if (saved && saved.exercises && saved.exercises.length) {
                    exercises = saved.exercises;
                    document.getElementById('workoutTitle').value = saved.title || 'Workout';
                    if (saved.notes) document.getElementById('notesBox').innerHTML = saved.notes;
                    workoutStartTime = saved.workoutStartTime || Date.now();
                    // recompute id seeds so future ids don't collide
                    exercises.forEach(ex => {
                        const n = parseInt((ex.id || 'ex0').replace('ex', ''), 10); if (n >= exIdSeed) exIdSeed = n + 1;
                        ex.sets.forEach(s => {
                            const sn = parseInt((s.id || 'set0').replace('set', ''), 10); if (sn >= setIdSeed) setIdSeed = sn + 1;
                        });
                    });
                } else {
                    exercises = [
                        newExercise('Squat (Bodyweight)'),
                        newExercise('Pistol Squat')
                    ];
                    exercises[0].sets = [newSet({ label: 'W', weight: '', reps: '15' })];
                    exercises[1].sets = [newSet({ reps: '9' }), newSet({ reps: '9' })];
                }

                render();
                startElapsedTimer();
            }

            init();
        })();
    </script>
</body>

</html>
