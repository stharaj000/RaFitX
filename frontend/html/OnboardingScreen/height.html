<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX — How tall are you?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/OnboardingCss/height.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">RaFitX</div>
        <div class="help">?</div>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg"></div>
        </div>
        <div class="step-label">STEP 5/6</div>
    </div>
    <div class="content">
        <h1>How tall are you?</h1>
        <div class="sub">Height helps us calculate your BMI and daily caloric needs more accurately.</div>
        <div class="toggle">
            <button class="active" id="cmBtn">cm</button>
            <button id="ftBtn">ft/in</button>
        </div>
        <div class="picker-wrap">
            <div class="center-lines"></div>
            <div class="picker" id="heightPicker"></div>
        </div>
        <div class="badge" id="heightBadge">Selected: 143 cm</div>
    </div>
    <div class="footer">
        <button id="continueButtonn" class="cta">Continue
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
            </svg>
        </button>

    </div>
    

    <script src="/frontend/js/onboardingScript/height.js"></script>
</body>

</html>
