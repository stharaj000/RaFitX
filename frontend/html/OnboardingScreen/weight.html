<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RaFitX — Define your Weight Target</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/OnboardingCss/weight.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">RaFitX</div>
        <div class="help">?</div>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg active"></div>
            <div class="seg"></div>
            <div class="seg"></div>
        </div>
        <div class="step-label">STEP 4/6</div>
    </div>
    <div class="content">
        <h1>Define your Weight Target</h1>
        <div class="sub">Your goals help us calculate the perfect caloric and activity balance for your transformation.
        </div>
        <div class="cards">
            <div class="card">
                <div class="card-label">CURRENT WEIGHT</div>
                <div class="picker-wrap">
                    <div class="center-lines"></div>
                    <div class="picker" id="currentPicker"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-label">GOAL WEIGHT</div>
                <div class="picker-wrap">
                    <div class="center-lines"></div>
                    <div class="picker" id="goalPicker"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <a href="height.html" style="text-decoration: none;"><button class="cta">Continue
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </a>
    </div>

    <script>
        function buildPicker(id, min, max, def, unit) {
            const el = document.getElementById(id);
            const itemH = 56;
            for (let v = min; v <= max; v++) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = v;
                div.innerHTML = v + (v === def ? ' <span class="unit">' + unit + '</span>' : '');
                el.appendChild(div);
            }
            function setSelected(val) {
                el.querySelectorAll('.picker-item').forEach(item => {
                    const isSel = parseInt(item.dataset.value) === val;
                    item.classList.toggle('selected', isSel);
                    item.innerHTML = item.dataset.value + (isSel ? ' <span class="unit">' + unit + '</span>' : '');
                });
            }
            el.scrollTop = (def - min) * itemH;
            setSelected(def);
            let t;
            el.addEventListener('scroll', () => {
                clearTimeout(t);
                t = setTimeout(() => {
                    const idx = Math.round(el.scrollTop / itemH);
                    setSelected(min + idx + 1);
                }, 0);
            });
        }
        buildPicker('currentPicker', 40, 150, 85, 'kg');
        buildPicker('goalPicker', 40, 150, 75, 'kg');
    </script>
</body>

</html>
